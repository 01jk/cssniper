[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
indexmap = "=2.13.0"
base64ct = "=1.7.3"
time = "=0.3.36"
home = "=0.5.11"
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures = "0.3.32"
urlencoding = "2.1.3"
image = { version = "0.24", default-features = false, features = ["png", "webp"] }

