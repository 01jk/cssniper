<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSFloat Sniper - Dashboard</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Tailwind config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#8b5cf6',
                        dark: '#1e293b',
                        darker: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Sidebar -->
    <div class="flex h-screen">
        <!-- Left Sidebar -->
        <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-6 border-b border-gray-700">
                <h1 class="text-2xl font-bold text-blue-400">🎯 CSFloat Sniper</h1>
            </div>

            <!-- Bot Status -->
            <div id="bot-status" class="p-4 border-b border-gray-700">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-gray-400">Bot Status</span>
                    <div id="bot-indicator" class="flex items-center">
                        <span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span>
                        <span class="text-xs text-gray-400">Stopped</span>
                    </div>
                </div>
                <button id="bot-toggle-btn"
                    class="w-full px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg text-sm font-medium transition-colors">
                    ▶ Start Bot
                </button>
            </div>

            <!-- Balance -->
            <div id="balance-section" class="p-4 border-b border-gray-700">
                <div class="text-sm text-gray-400 mb-1">CSFloat Balance</div>
                <div class="text-xl font-bold text-green-400">$---</div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 p-4 space-y-1">
                <a href="#dashboard"
                    class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors">
                    <span class="mr-3">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="#targets"
                    class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors">
                    <span class="mr-3">🎯</span>
                    <span>Targets</span>
                </a>
                <a href="#history"
                    class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors">
                    <span class="mr-3">📜</span>
                    <span>History</span>
                </a>
                <a href="#settings"
                    class="nav-link flex items-center px-4 py-3 rounded-lg hover:bg-gray-700 transition-colors">
                    <span class="mr-3">⚙️</span>
                    <span>Settings</span>
                </a>
            </nav>

            <!-- Footer -->
            <div class="p-4 border-t border-gray-700 text-xs text-gray-500 text-center">
                v2.0.0 | FastAPI + Vanilla JS
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <div id="app" class="container mx-auto p-8 max-w-screen-2xl">
                <!-- Page content will be rendered here -->
                <div class="flex items-center justify-center h-64">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                        <p class="text-gray-400">Loading...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/pages/dashboard.js"></script>
    <script src="/static/js/pages/targets.js"></script>
    <script src="/static/js/pages/history.js"></script>
    <script src="/static/js/pages/settings.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
